{{- /* Local cache for Grist's document SQLite files (/persist). The source of truth
       is the versioned S3 bucket (ADR-047), which object-backup copies off-site, so
       the PVC is not backed up. Single-instance, so ReadWriteOnce. */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grist-persist
  labels:
    app.kubernetes.io/name: grist
  annotations:
    # Survive `helm uninstall` (apply-prune / destroy): documents must never ride
    # the release lifecycle. Re-enabling Grist re-binds the same PVC.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
